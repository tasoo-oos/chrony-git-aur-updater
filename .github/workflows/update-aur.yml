name: Update AUR metadata

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Clone and update metadata without committing or pushing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: update-aur-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      PKGBASE: chrony-git
      AUR_REMOTE: ssh://aur@aur.archlinux.org/chrony-git.git
      GIT_AUTHOR_NAME: chrony-git updater
      GIT_AUTHOR_EMAIL: actions@github.com
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh sudo

      - name: Check out automation repository
        uses: actions/checkout@v5

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -dm700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/id_ed25519
          chmod 0600 /home/builder/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org > /home/builder/.ssh/known_hosts
          chmod 0644 /home/builder/.ssh/known_hosts
          chown -R builder:builder /home/builder/.ssh

      - name: Update AUR package metadata
        run: |
          chmod +x scripts/update-aur-vcs.sh
          sudo -u builder -H env \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            WORKDIR="/home/builder/aur-update-$PKGBASE" \
            PKGBASE="$PKGBASE" \
            AUR_REMOTE="$AUR_REMOTE" \
            DRY_RUN="$DRY_RUN" \
            GIT_AUTHOR_NAME="$GIT_AUTHOR_NAME" \
            GIT_AUTHOR_EMAIL="$GIT_AUTHOR_EMAIL" \
            bash -lc 'cd "$GITHUB_WORKSPACE" && ./scripts/update-aur-vcs.sh'
